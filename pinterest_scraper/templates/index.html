<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinterest Scraper</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a34; --txt:#e7e9ee; --muted:#8b90a0;
          --pink:#e60023; --green:#2ec36b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 20px 80px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px;
           padding:20px; margin-bottom:28px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  input[type=text], input[type=number] {
    background:#0f1115; border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:11px 13px; font-size:15px; }
  input[type=text] { flex:1; min-width:220px; }
  input[type=number] { width:90px; }
  button { cursor:pointer; border:none; border-radius:10px; padding:11px 20px;
           font-size:15px; font-weight:600; }
  .go { background:var(--pink); color:#fff; }
  .go:disabled { opacity:.5; cursor:default; }
  .prog { margin-top:14px; font-size:14px; color:var(--muted); display:none; }
  .bar { height:6px; background:#0f1115; border-radius:4px; margin-top:8px; overflow:hidden; }
  .bar > span { display:block; height:100%; width:0; background:var(--green); transition:width .3s; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
       margin:0 0 14px; }
  .coll { display:flex; align-items:center; gap:14px; padding:14px 16px;
          border:1px solid var(--line); border-radius:12px; margin-bottom:10px;
          text-decoration:none; color:var(--txt); transition:border-color .15s, background .15s; }
  .coll:hover { border-color:#3a4050; background:#1c2029; }
  .coll .nm { font-weight:600; flex:1; }
  .pill { font-size:12px; padding:3px 9px; border-radius:20px; background:#0f1115;
          border:1px solid var(--line); color:var(--muted); }
  .pill.k { color:var(--green); } .pill.t { color:var(--pink); }
  .empty { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📌 Pinterest Scraper</h1>
  <p class="sub">Download images for a search, then keep or trash them fast.</p>

  <div class="panel">
    <label for="q">Search term</label>
    <div class="row">
      <input type="text" id="q" placeholder="e.g. cottagecore aesthetic" autocomplete="off">
      <div>
        <label for="n">How many</label>
        <input type="number" id="n" value="50" min="1" max="500">
      </div>
      <button class="go" id="go">Scrape</button>
    </div>
    <div class="prog" id="prog">
      <span id="progtxt">Starting…</span>
      <div class="bar"><span id="progbar"></span></div>
    </div>
  </div>

  <h2>Your collections</h2>
  <div id="colls">
    {% if collections %}
      {% for c in collections %}
      <a class="coll" href="/review/{{ c.name }}">
        <span class="nm">{{ c.name }}</span>
        <span class="pill">{{ c.pending }} to review</span>
        <span class="pill k">{{ c.kept }} kept</span>
      </a>
      {% endfor %}
    {% else %}
      <p class="empty">No collections yet — scrape something above.</p>
    {% endif %}
  </div>
</div>

<script>
const go = document.getElementById('go');
const prog = document.getElementById('prog');
const progtxt = document.getElementById('progtxt');
const progbar = document.getElementById('progbar');

async function start() {
  const query = document.getElementById('q').value.trim();
  const limit = parseInt(document.getElementById('n').value) || 50;
  if (!query) { document.getElementById('q').focus(); return; }
  go.disabled = true;
  prog.style.display = 'block';
  progtxt.textContent = 'Searching Pinterest…';
  progbar.style.width = '0%';
  const r = await fetch('/api/scrape', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({query, limit})
  });
  if (!r.ok) {
    const e = await r.json();
    progtxt.textContent = e.error || 'Failed to start.';
    go.disabled = false;
    return;
  }
  poll();
}

async function poll() {
  const r = await fetch('/api/scrape/status');
  const s = await r.json();
  if (s.total > 0) {
    const pct = Math.round(s.done / s.total * 100);
    progbar.style.width = pct + '%';
    progtxt.textContent = `Downloading ${s.done} / ${s.total}…`;
  }
  if (s.running) { setTimeout(poll, 700); return; }
  if (s.error) { progtxt.textContent = 'Error: ' + s.error; go.disabled = false; return; }
  if (s.result) {
    progtxt.textContent = `Done — ${s.result.downloaded} new images.`;
    progbar.style.width = '100%';
    setTimeout(() => location.href = '/review/' + encodeURIComponent(
      s.result.folder.split(/[\\/]/).pop()), 600);
  } else {
    go.disabled = false;
  }
}

go.addEventListener('click', start);
document.getElementById('q').addEventListener('keydown', e => { if (e.key==='Enter') start(); });
</script>
</body>
</html>
